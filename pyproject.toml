[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eo-stt"
version = "0.1.0"
description = "Esperanto speech-to-text: mp3 audio to .srt subtitles, with a GUI (Linux/Windows)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # CPU-only ONNX inference (INT8 model, loaded from local files — no torch/NeMo/CUDA).
    # onnxruntime pins mirror onnx-asr's "cpu" extra.
    "onnxruntime>=1.18.1,!=1.24.1,!=1.25.*,!=1.26.0",
    "onnx-asr>=0.12",
    "numpy>=1.24",
    "soundfile>=0.12",
    "customtkinter>=5.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "lameenc>=1.4"]
build = ["pyinstaller>=6"]

[project.scripts]
eo-stt = "eo_stt.__main__:main"
eo-stt-cli = "eo_stt.cli:main"

[tool.setuptools.packages.find]
include = ["eo_stt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
