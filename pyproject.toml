[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eo-srt"
# The version lives in exactly one place: eo_srt/__init__.py::__version__
# (the GUI's "pri" window and build.py's executable name both read it from
# there, so the package metadata, the app and the exe can never drift apart).
dynamic = ["version"]
description = "Esperanto speech-to-text: mp3 audio to .srt subtitles, with a GUI (Linux/Windows)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # CPU-only ONNX inference (INT8 model, loaded from local files — no torch/NeMo/CUDA).
    # onnxruntime pins mirror onnx-asr's "cpu" extra.
    "onnxruntime>=1.18.1,!=1.24.1,!=1.25.*,!=1.26.0",
    "onnx-asr>=0.12",
    "numpy>=1.24",
    "soundfile>=0.12",
    "customtkinter>=5.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "lameenc>=1.4"]
# Pillow: PyInstaller converts the PNG app icon to .ico for the Windows exe.
build = ["pyinstaller>=6", "pillow>=10"]

[project.scripts]
eo-srt = "eo_srt.__main__:main"
eo-srt-cli = "eo_srt.cli:main"

[tool.setuptools.packages.find]
include = ["eo_srt*"]

[tool.setuptools.dynamic]
version = {attr = "eo_srt.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
