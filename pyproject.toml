[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eo-stt"
version = "0.1.0"
description = "Esperanto speech-to-text: mp3 audio to .srt subtitles, with a GUI (Linux/Windows)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2",
    "nemo_toolkit[asr]>=2.0",
    "soundfile>=0.12",
    "scipy>=1.10",
    "numpy>=1.24",
    "huggingface_hub>=0.20",
    "customtkinter>=5.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "lameenc>=1.4"]
build = ["pyinstaller>=6"]

[project.scripts]
eo-stt = "eo_stt.__main__:main"
eo-stt-cli = "eo_stt.cli:main"

[tool.setuptools.packages.find]
include = ["eo_stt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
