name: Build portable executables

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[build]"

      - name: Build with PyInstaller
        run: python build.py

      - name: Zip the bundle
        shell: bash
        run: tar -czf "dist/eo-stt-${{ matrix.os }}.tar.gz" -C dist eo-stt

      - uses: actions/upload-artifact@v4
        with:
          name: eo-stt-${{ matrix.os }}
          path: dist/eo-stt-${{ matrix.os }}.tar.gz

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/eo-stt-*.tar.gz
