name: Build portable executables

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

  build:
    name: Build (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-glob: pyproject.toml

      # The INT8 model (~142 MB) is fetched at build time and bundled into the
      # executable; cache it so only the first build downloads it.
      - name: Restore the INT8 model
        uses: actions/cache@v4
        with:
          path: models
          key: eo-stt-model-${{ hashFiles('fetch_model.py') }}

      - name: Install dependencies (CPU-only ONNX stack)
        run: python -m pip install -e ".[build]"

      - name: Fetch the INT8 model (pinned, sha256-verified)
        run: python fetch_model.py

      # The executable is named with the version (eo-stt-v0.2-linux /
      # eo-stt-v0.2.exe): CI passes the release tag, local builds default to
      # v<eo_stt.__version__>.
      - name: Build with PyInstaller
        run: python build.py --version "${{ github.ref_name }}"

      # The built executable must actually start. Regression guard: a bundled
      # ucrtbase.dll once made the Windows exe die in the PyInstaller bootloader
      # ("Failed to load Python DLL") before any Python code ran — building
      # successfully does not prove the artifact works.
      - name: Smoke-test the executable
        if: matrix.label == 'linux'
        run: dist/eo-stt/eo-stt-${{ github.ref_name }}-linux --help

      - name: Smoke-test the executable
        if: matrix.label == 'windows'
        run: dist\eo-stt\eo-stt-${{ github.ref_name }}.exe --help

      # The archives contain the bundle's files directly (the versioned
      # executable, _internal/ and model/ at the archive root) — no top-level
      # eo-stt/ folder to open first after extracting.
      - name: Pack the bundle (tar.gz)
        if: matrix.label == 'linux'
        shell: bash
        run: tar -czf "dist/eo-stt-${{ github.ref_name }}-linux.tar.gz" -C dist/eo-stt .

      - name: Zip the bundle
        if: matrix.label == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist\eo-stt\* -DestinationPath "dist\eo-stt-${{ github.ref_name }}-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: eo-stt-${{ github.ref_name }}-${{ matrix.label }}
          path: dist/eo-stt-${{ github.ref_name }}-${{ matrix.label }}.*

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/eo-stt-*
          generate_release_notes: true
