name: Build portable executables

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

  build:
    name: Build (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          # macOS builds run on Apple's hosted runners — no Mac needed.
          # macos-latest is Apple Silicon (arm64); macos-26-intel covers
          # Intel Macs (x86_64). Both produce dist/eo-srt.app (a
          # double-clickable bundle) with the exe named
          # eo-srt-v<version>-macos inside Contents/MacOS/.
          - os: macos-latest
            label: macos
          - os: macos-26-intel
            label: macos-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-glob: pyproject.toml

      # eo_srt/__init__.py::__version__ is the single source of the version:
      # the "pri" window and the executable name both come from it. Fail fast
      # (before the model download) when a release tag disagrees with it —
      # tagging v1.0 without bumping __version__ would otherwise ship an exe
      # whose "pri" window still says v0.3.
      - name: Check the release tag matches the package version
        if: matrix.label == 'linux' && startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(python -c "from eo_srt import __version__; print(__version__)")"
          if [ "$expected" != "${{ github.ref_name }}" ]; then
            echo "error: tag '${{ github.ref_name }}' does not match eo_srt.__version__ (${expected})." >&2
            echo "Bump __version__ in eo_srt/__init__.py to match the tag, then re-tag." >&2
            exit 1
          fi
          echo "OK: tag '${{ github.ref_name }}' matches the package version (${expected})"

      # The INT8 model (~142 MB) is fetched at build time and bundled into the
      # executable; cache it so only the first build downloads it.
      - name: Restore the INT8 model
        uses: actions/cache@v4
        with:
          path: models
          key: eo-srt-model-${{ hashFiles('fetch_model.py') }}

      - name: Install dependencies (CPU-only ONNX stack)
        run: python -m pip install -e ".[build]"

      - name: Fetch the INT8 model (pinned, sha256-verified)
        run: python fetch_model.py

      # The executable is named with the package version (eo-srt-v1.0-linux /
      # eo-srt-v1.0.exe / eo-srt-v1.0-macos): eo_srt.__version__ is the single source of the
      # version (the GUI's "pri" window shows it too), and the check above
      # guarantees the release tag agrees with it.
      - name: Build with PyInstaller
        run: python build.py

      # The built executable must actually start. Regression guard: a bundled
      # ucrtbase.dll once made the Windows exe die in the PyInstaller bootloader
      # ("Failed to load Python DLL") before any Python code ran — building
      # successfully does not prove the artifact works. The glob locates the
      # exe because build.py names it from eo_srt.__version__, not from the git
      # ref — on a workflow_dispatch run from a branch the ref name would not
      # match. On macOS this runs the .app bundle's binary with --help (the CLI
      # path, which needs no display); PyInstaller ad-hoc signs the .app bundle
      # (codesign --deep) during the build.
      - name: Smoke-test the executable
        shell: bash
        run: |
          case "${{ matrix.label }}" in
            windows) dist/eo-srt/eo-srt-*.exe --help ;;
            macos*)  dist/eo-srt.app/Contents/MacOS/eo-srt-* --help ;;
            *)       dist/eo-srt/eo-srt-* --help ;;
          esac

      # Linux archives contain the onedir bundle's files directly (the
      # versioned executable, _internal/ and model/ at the archive root); the
      # macOS archives contain eo-srt.app at the archive root — double-clickable
      # after extracting. No top-level folder to open first in either case.
      - name: Pack the bundle (tar.gz)
        if: matrix.label != 'windows'
        shell: bash
        run: |
          if [[ "${{ matrix.label }}" == macos* ]]; then
            tar -czf "dist/eo-srt-${{ github.ref_name }}-${{ matrix.label }}.tar.gz" -C dist eo-srt.app
          else
            tar -czf "dist/eo-srt-${{ github.ref_name }}-${{ matrix.label }}.tar.gz" -C dist/eo-srt .
          fi

      - name: Zip the bundle
        if: matrix.label == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist\eo-srt\* -DestinationPath "dist\eo-srt-${{ github.ref_name }}-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: eo-srt-${{ github.ref_name }}-${{ matrix.label }}
          path: dist/eo-srt-${{ github.ref_name }}-${{ matrix.label }}.*

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/eo-srt-*
          generate_release_notes: true
